<style>
:root{color-scheme:dark;--base:#0b1220;--panel:#131d30;--edge:#2b3854;--ink:#f5f2ff;--soft:#b5bfd5;--violet:#a78bfa;--mint:#78e5cf}
*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--ink);font:16px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer;color:inherit;background:#1a2640;border:1px solid var(--edge);border-radius:8px;min-height:44px;padding:7px 13px}button:hover,button[aria-pressed=true]{border-color:var(--violet)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}button:disabled{opacity:.45;cursor:default}a{color:inherit;text-decoration:none}.primary{background:var(--violet);color:#100c24;font-weight:750;border-color:transparent}.top{border-bottom:1px solid var(--edge);background:#10192a}.bar,main,footer{max-width:1180px;margin:auto;padding:0 24px}.bar{min-height:76px;display:flex;align-items:center;gap:20px;justify-content:space-between}.wordmark{font-size:22px;font-weight:820;letter-spacing:-.04em}.identity small{display:block;color:var(--soft);font-size:10px;letter-spacing:.13em}.nav{display:flex;gap:7px}.nav button{background:transparent}.nav .primary{background:var(--violet)}main{min-height:77vh}.hero{position:relative;margin:26px 0 24px;padding:30px;background:radial-gradient(ellipse at 79% 25%,#37265e,transparent 56%),var(--panel);border:1px solid var(--edge);border-radius:18px}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(#a78bfa13 1px,transparent 1px),linear-gradient(90deg,#a78bfa13 1px,transparent 1px);background-size:29px 29px;mask-image:linear-gradient(90deg,transparent 40%,#000);pointer-events:none}.hero>*{position:relative}.eyebrow{color:var(--mint);font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}h1,h2,h3,p{margin:0}h1{font-size:clamp(34px,5vw,61px);line-height:1.02;letter-spacing:-.055em;margin:8px 0 12px}h2{font-size:23px;letter-spacing:-.035em}h3{font-size:16px}.muted,.sub{color:var(--soft)}.sub{font-size:14px}.search{display:flex;gap:8px;max-width:670px;margin:19px 0 12px}.search input{flex:1;min-width:0;background:#0d1626;color:var(--ink);border:1px solid var(--edge);padding:12px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card,.box{background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:15px}.card h3{display:flex;align-items:center;gap:9px}.icon{display:inline-grid;place-items:center;width:33px;height:33px;background:#24213d;color:var(--violet);border-radius:8px;font-size:18px;flex:none}.open{display:flex;align-items:center;gap:9px;min-height:47px;margin-top:9px;padding:7px 9px;border:1px solid var(--edge);border-radius:7px}.open:hover{border-color:var(--violet)}.arrow{margin-left:auto;color:var(--mint)}.title-row,.controls{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.title-row{justify-content:space-between;margin:16px 0 11px}.pill{border:1px solid var(--edge);border-radius:20px;padding:2px 9px;color:var(--mint);font-size:12px}.collections{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.collection{text-align:left;display:flex;align-items:center;gap:8px;background:var(--panel)}.crumb{display:flex;gap:10px;align-items:center;margin-top:17px;color:var(--soft);font-size:14px}.work-title{font-size:clamp(31px,5vw,49px)}.workspace{display:grid;grid-template-columns:minmax(0,1.95fr) minmax(240px,1fr);gap:12px;margin-top:13px}.stage{background:radial-gradient(ellipse at 52% 50%,#231f43,transparent 72%),linear-gradient(#a78bfa12 1px,transparent 1px),linear-gradient(90deg,#a78bfa12 1px,transparent 1px),#10192a;background-size:auto,24px 24px,24px 24px,auto;border:1px solid var(--edge);border-radius:12px;display:grid;align-items:center;min-height:229px;padding:18px}.network{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative;gap:5px;text-align:center;padding-top:10px}.network::before{content:"";position:absolute;left:12.5%;right:12.5%;top:41px;border-bottom:2px dashed #566288}.node{position:relative;z-index:1;font-size:clamp(10px,2vw,14px)}.node b{font-family:ui-monospace,monospace}.node span{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 8px;border:1px solid #576389;border-radius:13px;background:#1c2c48;color:var(--violet);font-size:25px}.node.active span{border-color:var(--mint);color:var(--mint);box-shadow:0 0 16px #78e5cf50}.pulse{position:absolute;top:36px;left:var(--to);width:12px;height:12px;background:var(--mint);border-radius:100%;box-shadow:0 0 15px var(--mint);z-index:2;animation:travel .45s both}@keyframes travel{from{left:var(--from)}to{left:var(--to)}}.toolbar{margin-top:10px}.events{display:grid;gap:5px;margin-top:10px}.event{display:grid;grid-template-columns:62px 63px 1fr;align-items:center;text-align:left;gap:7px;width:100%;background:#10192a}.event.selected{border-color:var(--mint);color:var(--mint)}.details p{margin-top:8px}.steps{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}.steps button{font-size:13px}.sequence{display:grid;gap:4px}.sequence div{border-bottom:1px solid var(--edge);padding:4px;color:var(--soft);font-size:13px}.sequence .active{color:var(--mint)}.demo{margin-top:15px}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.pad{font-size:24px;min-height:90px}.pad.hot,.led.on{background:var(--mint);color:#0b1220}.led{display:grid;place-items:center;width:75px;height:75px;border:1px solid var(--edge);border-radius:100%;margin:16px 0;background:#24304a}footer{padding-top:25px;padding-bottom:24px;color:var(--soft);font-size:13px}[hidden]{display:none!important}
@media(max-width:800px){.collections{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:1fr}.details{grid-row:2}.bar,main,footer{padding-left:15px;padding-right:15px}}
@media(max-width:600px){body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}.bar{min-height:60px}.nav{position:fixed;inset:auto 0 0;z-index:5;background:#10192a;border-top:1px solid var(--edge);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:5px 4px calc(6px + env(safe-area-inset-bottom))}.nav button{font-size:11px;padding:5px 2px;line-height:1.15;min-height:50px}.nav span{display:block;font-size:17px;margin-bottom:2px}.hero{margin-top:14px;padding:16px}.grid{grid-template-columns:1fr}.stage{padding:10px;min-height:185px}.node span{width:40px;height:40px}.network:before{top:30px}.pulse{top:25px}.toolbar button,.toolbar select{padding-inline:8px}.events .event{grid-template-columns:47px 46px 1fr;font-size:13px}.pads .pad{min-height:62px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}

body.home-view{color-scheme:light;--base:#eef0fa;--panel:#fff;--edge:#cbd0e4;--ink:#16172e;--soft:#515773;--violet:#6c45b7;--mint:#315d55}
.home-view .top,.home-view .nav{background:#fcfbff}.home-view .nav .primary,.home-view .primary{background:#623ca7;color:white}.home-view .icon{background:#eee7fa;color:#593994}
.directory{padding-top:19px}.directory .search{max-width:none;margin:0 0 16px}.directory .search input{background:white;color:var(--ink)}.directory .search button{white-space:nowrap}.directory h1{font-size:clamp(25px,3vw,37px);letter-spacing:-.04em;margin:0}.directory .grid{align-items:start;gap:14px}.directory .card{border-top:4px solid #8b68c6;border-radius:9px;padding:14px;min-width:0}.directory .card:nth-child(3n+2){border-top-color:#58959d}.directory .card:nth-child(3n){border-top-color:#af778d}.directory .card h3{justify-content:space-between}.directory .card h3>span:first-child{display:flex;gap:8px;align-items:center}.directory .open{border:0;border-bottom:1px solid var(--edge);border-radius:0;margin-top:2px;padding-inline:3px}.directory .view-all{background:#f0ecf9;color:#3c246a;margin-top:8px;width:100%;text-align:left}.featured{display:grid;gap:8px;background:#e9e2f8}.directory .featured .open{border:1px solid var(--edge);border-radius:7px;background:white;padding-inline:10px}.directory #results{background:white;border-radius:8px;padding:0 12px;margin-bottom:12px}
body.protocol-view main{max-width:1600px}.protocol-view .work-title{font-size:clamp(24px,3vw,36px);letter-spacing:-.03em}.bench{display:grid;grid-template-columns:minmax(165px,.85fr) minmax(0,2.55fr) minmax(190px,1fr);grid-template-areas:"rail stage inspector" "rail log log";gap:10px}.rail{grid-area:rail}.diagram{grid-area:stage}.details{grid-area:inspector}.log{grid-area:log}.bench .box{border-radius:8px}.stage{min-height:350px;overflow:hidden}.stage-head{display:flex;gap:6px;margin-bottom:8px}.rail .steps{display:grid;margin-bottom:0}.rail .steps button{width:100%;text-align:left;display:flex;align-items:center;gap:8px}.step-number{color:var(--mint);font-family:ui-monospace,monospace}.bench .toolbar{margin:0}.bench .event{grid-template-columns:2.1rem 4.1rem 5.2rem 5.2rem 4rem minmax(0,1fr);font-size:13px}.bench .column-head{padding:0 13px;color:var(--soft);background:none;text-transform:uppercase;font-size:11px;min-height:28px}.bench .lab-note{margin-top:13px}.network{height:280px;display:block;padding:0}.network::before{display:none}.node{position:absolute;transform:translate(-50%,-50%);padding:2px}.node span{box-shadow:3px 4px 0 #080e1a;border-radius:12px}.map-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.map-lines path{stroke:#586382;stroke-width:1;stroke-dasharray:2 2;fill:none}.network .pulse{top:auto;animation:map-travel .55s both;transform:translate(-50%,-50%)}@keyframes map-travel{from{left:var(--from);top:var(--from-y)}to{left:var(--to);top:var(--to-y)}}.network .pulse{left:var(--to);top:var(--to-y)}
@media(max-width:950px){.bench{grid-template-columns:minmax(0,1.6fr) minmax(190px,1fr);grid-template-areas:"stage inspector" "rail rail" "log log"}.rail .steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.directory .grid{grid-template-columns:1fr}.bench{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "log" "rail" "inspector"}.stage{min-height:238px}.network{height:215px}.rail .steps{grid-template-columns:1fr}.bench .event{grid-template-columns:1.2rem 3.1rem 3.1rem minmax(0,1fr);font-size:12px}.bench .endpoint{display:none}.directory .search{flex-wrap:wrap}.directory .search input{min-width:150px}}

</style>

<body>
<header class="top"><div class="bar"><div class="identity"><a class="wordmark" href="#home">AdigunIoT</a><small>HEPHZIBAH BEHULAH · HB ARTIFICIAL INTELLIGENCE</small></div><nav class="nav" aria-label="Primary navigation"><button data-nav="home"><span aria-hidden="true">⌂</span> Home</button><button data-nav="browse"><span aria-hidden="true">▦</span> Browse</button><button data-nav="search"><span aria-hidden="true">⌕</span> Search</button><button class="primary" data-nav="surprise"><span aria-hidden="true">⤨</span> Surprise Me</button></nav></div></header>
<main id="main"></main>
<footer>AdigunIoT · Interactive design preview · Three sample experiences · Simulated data</footer>
<script>
'use strict';
const main=document.querySelector('#main');
const modules=[
 {key:'protocol',name:'Adigun Protocol Explorer',pitch:'Follow a web request, one message at a time.',group:0,icon:'⇄'},
 {key:'signal',name:'Signal Catch',pitch:'Catch the pulse before it moves.',group:1,icon:'✦'},
 {key:'circuit',name:'Paper Circuit',pitch:'Build a virtual circuit and light an LED.',group:2,icon:'⌁'}
];
const groups=[['Systems & Engineering','⇄'],['Arcade & Challenges','✦'],['DIY & Making','⌁'],['Science & Nature','☄'],['Creative Studio','✎'],['Web & Digital Worlds','▣'],['AI & Digital Trust','◇'],['Money & Markets','▥'],['Faith & Biblical Learning','▤'],['Civic Life & Society','⚖']];
const link=m=>'<a class="open" href="#'+m.key+'"><span aria-hidden="true">'+m.icon+'</span>'+m.name+'<span class="arrow" aria-hidden="true">→</span></a>';
const card=m=>'<article class="card"><h3><span class="icon" aria-hidden="true">'+m.icon+'</span>'+groups[m.group][0]+'</h3><p class="sub">'+m.pitch+'</p>'+link(m)+'</article>';
let route='',timer=null,roundTimer=null,currentEvent=-1,scenario=0,mode='network',speed=1,playing=false;
let round=0,score=0,hot=-1,lastHot=-1,running=false,endsAt=0;
let foil=false,reverse=false,closed=false;
const base=[
 ['0.000','DNS','Browser','Resolver','Ask for the address of demo.example.','The browser needs an address to reach the website.'],
 ['0.018','DNS','Resolver','Browser','Return a synthetic address, 203.0.113.42.','The browser can now address the request to the origin.'],
 ['0.038','TCP','Browser','Origin','Open a connection via the gateway.','The transport connection is established before this model sends its request.'],
 ['0.057','HTTP','Browser','Origin','Request the demonstration page.','The request tells the server which resource the browser wants.'],
 ['0.094','HTTP','Origin','Browser','Return a 200 OK response.','The server found the page and returned its content.'],
 ['0.104','PAGE','Browser','Browser','Display the received page.','The browser interprets the response and paints the page.']
];
function events(){
 if(scenario===1)return [['0.000','CACHE','Browser','Browser','Reuse the address from the local cache.','A valid cached answer skips the resolver exchange.'],...base.slice(2)];
 if(scenario===2)return [...base.slice(0,4),['0.300','WAIT','Origin','Origin','Simulate the server preparing a reply.','During a slow reply, the browser waits for response data.'],['0.600',...base[4].slice(1)],['0.612',...base[5].slice(1)]];
 return base;
}
function home(){
 main.innerHTML='<section class="directory"><div class="search"><input id="query" type="search" aria-label="Search playable experiences" placeholder="Search games, explainers and DIY…"><button class="primary" data-nav="surprise">⤨ Surprise Me</button></div><div id="results" aria-live="polite" hidden></div><div class="title-row"><h1>Explore AdigunIoT</h1><span class="pill">3 playable previews</span></div><div id="collections" class="grid">'+groups.slice(0,3).map(([name,icon],i)=>'<article class="card"><h3><span><span class="icon" aria-hidden="true">'+icon+'</span>'+name+'</span><span class="pill">1 playable</span></h3><p class="sub">'+modules[i].pitch+'</p>'+link(modules[i])+'<button class="view-all" data-group="'+i+'">View collection →</button></article>').join('')+'<article class="card featured"><h3>Featured · Network workbench</h3><p class="sub">Compare a first visit with a cached lookup or a slow reply.</p>'+link(modules[0])+'</article><article class="card"><h3>More collections</h3><p class="sub">Planned catalog areas</p>'+groups.slice(3).map(([name,icon],i)=>'<button class="view-all" data-group="'+(i+3)+'"><span aria-hidden="true">'+icon+'</span> '+name+'</button>').join('')+'</article></div><section id="collection-detail" class="demo" aria-live="polite"></section></section>';
 const input=document.querySelector('#query');
 input.addEventListener('input',()=>{const result=document.querySelector('#results');const q=input.value.trim().toLowerCase();result.hidden=!q;const list=modules.filter(m=>(m.name+' '+m.pitch+' '+groups[m.group][0]).toLowerCase().includes(q));result.innerHTML=q?(list.map(link).join('')||'<p>No playable preview matches. Try “protocol”, “signal”, or “circuit”.</p>'):'';});
 input.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#results a')?.click();});
}
function heading(m){return '<div class="crumb"><a href="#home">Home</a><span aria-hidden="true">/</span><span>'+groups[m.group][0]+'</span></div><h1 class="work-title">'+m.name+'</h1><p class="muted">'+m.pitch+'</p>';}
function protocol(){
 main.innerHTML=heading(modules[0])+'<div class="title-row"><div class="controls"><label for="scenario">Scenario</label><select id="scenario"><option>First visit</option><option>DNS answer cached</option><option>Slow reply</option></select></div></div><section class="bench" aria-label="Protocol workbench"><aside class="box rail"><div class="eyebrow">Lesson steps</div><h2>Web request</h2><p class="sub">Choose a step to inspect.</p><div id="steps" class="steps"></div></aside><section class="diagram"><div class="stage-head"><button data-action="network" aria-pressed="true">Network</button><button data-action="sequence" aria-pressed="false">Sequence</button></div><div id="stage" class="stage" aria-label="Simulation stage"></div></section><aside class="box details"><div class="eyebrow">Event inspector</div><h2 id="event-title"></h2><p id="event-summary"></p><p id="event-why" class="muted"></p><p class="sub lab-note">Synthetic traffic. The lesson simplifies the web request.</p></aside><section class="box log"><h2>Packet timeline</h2><div class="controls toolbar"><button class="primary" data-action="play" id="play">▶ Play</button><button data-action="previous">Previous</button><button data-action="next">Next</button><button data-action="restart">Restart</button><select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><p id="progress" class="sub" aria-live="polite"></p><div id="events" class="events"></div></section></section>';
 document.querySelector('#scenario').onchange=e=>{stop();scenario=e.target.selectedIndex;currentEvent=-1;draw();};
 document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);if(playing)schedule();};
 draw();
}
function draw(){
 const list=events(),item=list[currentEvent],nodes=['Browser','Gateway','Resolver','Origin'],icons=['▱','◇','◎','▥'];
 const stage=document.querySelector('#stage');if(!stage)return;
 const positions=[[12,66],[37,46],[66,23],[86,64]];
 const point=n=>positions[nodes.indexOf(n)];
 const from=item?point(item[2]):null,to=item?point(item[3]):null;
 stage.innerHTML=mode==='network'?'<div class="network"><svg class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M12 66L37 46L66 23M37 46L86 64"/></svg>'+nodes.map((n,i)=>'<div class="node '+(item?.slice(2,4).includes(n)?'active':'')+'" style="left:'+positions[i][0]+'%;top:'+positions[i][1]+'%"><span aria-hidden="true">'+icons[i]+'</span><b>'+n+'</b></div>').join('')+(item?'<span class="pulse" aria-hidden="true" style="--from:'+from[0]+'%;--from-y:'+from[1]+'%;--to:'+to[0]+'%;--to-y:'+to[1]+'%"></span>':'')+'</div>':'<div class="sequence">'+list.map((e,i)=>'<div class="'+(i===currentEvent?'active':'')+'">'+(i+1)+'. '+e[2]+' → '+e[3]+' · '+e[1]+'</div>').join('')+'</div>';
 document.querySelector('#event-title').textContent=item?item[1]+' · '+item[0]+' s':'Ready to begin';
 document.querySelector('#event-summary').textContent=item?item[4]:'What happens before a website appears?';
 document.querySelector('#event-why').textContent=item?item[5]:'Press Play or select an event to see what happens.';
 const updateList=(id,markup)=>{const container=document.querySelector(id);const focused=document.activeElement?.dataset.event;const restore=container.contains(document.activeElement);container.innerHTML=markup;if(restore)container.querySelector('[data-event="'+focused+'"]')?.focus({preventScroll:true});};
 updateList('#steps',list.map((e,i)=>'<button data-event="'+i+'" aria-pressed="'+(i===currentEvent)+'" aria-label="Step '+(i+1)+': '+e[4]+'"><span class="step-number">'+(i+1)+'</span>'+e[4]+'</button>').join(''));
 updateList('#events','<div class="event column-head" aria-hidden="true"><span>#</span><span>Time</span><span class="endpoint">From</span><span class="endpoint">To</span><span>Type</span><span>Event</span></div>'+list.map((e,i)=>'<button class="event '+(i===currentEvent?'selected':'')+'" aria-pressed="'+(i===currentEvent)+'" data-event="'+i+'"><span>'+(i+1)+'</span><span>'+e[0]+'s</span><span class="endpoint">'+e[2]+'</span><span class="endpoint">'+e[3]+'</span><strong>'+e[1]+'</strong><span>'+e[4]+'</span></button>').join(''));
 document.querySelector('#progress').textContent=playing?'Playing · '+(currentEvent+1)+' / '+list.length:'Step '+(currentEvent+1)+' of '+list.length+(currentEvent===list.length-1?' · Complete':'');
 document.querySelector('#play').textContent=playing?'Ⅱ Pause':'▶ Play';
 for(const view of ['network','sequence'])document.querySelector('[data-action="'+view+'"]').setAttribute('aria-pressed',String(mode===view));
}
function stop(){clearTimeout(timer);timer=null;playing=false;}
function advance(){
 if(!playing)return;
 currentEvent++;
 if(currentEvent>=events().length-1)stop();
 draw();if(playing)schedule();
}
function schedule(){clearTimeout(timer);timer=setTimeout(advance,1100/speed);}
function signal(){main.innerHTML=heading(modules[1])+'<section class="box demo"><h2>Catch the pulse</h2><p class="muted">Tap the lit pad or press 1–4. You have 20 seconds.</p><div class="pads">'+[0,1,2,3].map(i=>'<button class="pad" data-pad="'+i+'" aria-label="Pad '+(i+1)+'">'+(i+1)+'</button>').join('')+'</div><div class="controls"><button class="primary" data-action="round">Start round</button><strong id="score" aria-live="polite">Score: 0</strong></div></section>';}
function signalTick(){
 if(!running)return;
 if(Date.now()>=endsAt){running=false;hot=-1;paintPads();document.querySelector('#score').textContent='Round complete · Score: '+score;return;}
 hot=(lastHot+1+Math.floor(Math.random()*3))%4;lastHot=hot;paintPads();
 roundTimer=setTimeout(signalTick,Math.min(850,endsAt-Date.now()));
}
function paintPads(){document.querySelectorAll('[data-pad]').forEach(b=>{const active=Number(b.dataset.pad)===hot;b.classList.toggle('hot',active);b.textContent=active?'✦':Number(b.dataset.pad)+1;});}
function catchPad(i){if(!running||i!==hot)return;hot=-1;score++;paintPads();document.querySelector('#score').textContent='Score: '+score;}
function circuit(){main.innerHTML=heading(modules[2])+'<section class="box demo"><h2>Light the virtual LED</h2><p class="muted">Add a foil path, orient the LED, then close the switch.</p><div id="led" class="led" aria-hidden="true">LED</div><div class="controls"><button data-action="foil"></button><button data-action="polarity"></button><button data-action="switch"></button><button data-action="reset-circuit">Reset</button></div><p id="circuit-state" class="muted" aria-live="polite"></p></section>';drawCircuit();}
function drawCircuit(){const on=foil&&closed&&!reverse;document.querySelector('#led').classList.toggle('on',on);document.querySelector('[data-action="foil"]').textContent=foil?'Remove foil':'Add foil';document.querySelector('[data-action="polarity"]').textContent=reverse?'LED: reversed':'LED: forward';document.querySelector('[data-action="switch"]').textContent=closed?'Open switch':'Close switch';document.querySelector('#circuit-state').textContent=on?'Closed loop · The LED is on.':!foil||!closed?'Open loop · Current has no complete path.':'Closed loop · The LED is reversed.';}
function render(){
 stop();clearTimeout(roundTimer);running=false;round=0;score=0;hot=-1;lastHot=-1;
 currentEvent=-1;scenario=0;mode='network';speed=1;foil=false;reverse=false;closed=false;
 const previous=route;route=location.hash.slice(1);document.body.classList.toggle('home-view',!modules.some(m=>m.key===route));document.body.classList.toggle('protocol-view',route==='protocol');
 if(route==='protocol')protocol();else if(route==='signal')signal();else if(route==='circuit')circuit();else home();
 window.scrollTo(0,0);if(previous){const title=main.querySelector('h1');title.tabIndex=-1;title.focus({preventScroll:true});}
}
function showHome(target){if(!['protocol','signal','circuit'].includes(route)){target();return;}window.addEventListener('hashchange',target,{once:true});location.hash='home';}
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 const {nav,group,action,event,pad}=button.dataset;
 if(nav==='home')location.hash='home';
 if(nav==='browse')showHome(()=>document.querySelector('#collections').scrollIntoView());
 if(nav==='search')showHome(()=>document.querySelector('#query').focus());
 if(nav==='surprise'){const list=modules.filter(m=>m.key!==route);location.hash=list[Math.floor(Math.random()*list.length)].key;}
 if(group!==undefined){const detail=document.querySelector('#collection-detail'),items=modules.filter(m=>m.group===Number(group));detail.innerHTML='<div class="box"><h2>'+groups[group][0]+'</h2>'+(items.map(link).join('')||'<p class="sub">No experiences in this collection are available in the preview.</p>')+'</div>';detail.scrollIntoView({block:'nearest'});}
 if(event!==undefined){stop();currentEvent=Number(event);draw();}
 if(pad!==undefined)catchPad(Number(pad));
 if(!action)return;
 if(route==='protocol'){
  if(action==='network'||action==='sequence')mode=action;
  if(action==='play'){if(playing)stop();else{if(currentEvent===events().length-1)currentEvent=-1;playing=true;schedule();}}
  if(action==='previous'){stop();currentEvent=Math.max(-1,currentEvent-1);}
  if(action==='next'){stop();currentEvent=Math.min(events().length-1,currentEvent+1);}
  if(action==='restart'){stop();currentEvent=-1;}
  draw();
 }
 if(route==='signal'&&action==='round'){clearTimeout(roundTimer);round++;running=true;score=0;endsAt=Date.now()+20000;button.textContent='Restart round';document.querySelector('#score').textContent='Score: 0';signalTick();}
 if(route==='circuit'){if(action==='foil')foil=!foil;if(action==='polarity')reverse=!reverse;if(action==='switch')closed=!closed;if(action==='reset-circuit')foil=reverse=closed=false;drawCircuit();}
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showHome(()=>document.querySelector('#query').focus());}
 if(route==='signal'&&/^[1-4]$/.test(e.key)&&!e.repeat)catchPad(Number(e.key)-1);
});
window.addEventListener('hashchange',render);render();
</script>
</body>
