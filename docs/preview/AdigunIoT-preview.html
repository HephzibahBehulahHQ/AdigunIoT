 '<rect x="9" y="13" width="16" height="22" rx="3" fill="#567784"/><rect x="29" y="13" width="16" height="22" rx="3" fill="#567784"/><rect x="49" y="13" width="16" height="22" rx="3" fill="#087b69"/><rect x="69" y="13" width="16" height="22" rx="3" fill="#567784"/><path d="M57 17l-4 7h4l-2 6 6-8h-4z" fill="#fff"/>',
 '<path d="M18 13h25m17 0h15v23H18V13m23 0 18-6" fill="none" stroke="#864426" stroke-width="2"/><rect x="9" y="22" width="18" height="8" rx="2" fill="#a95f3a"/><circle cx="75" cy="24" r="6" fill="#dc8f38"/><path d="M84 18l5-3m-5 10h6" stroke="#ae5c12" stroke-width="2"/>'
];
function featured(){
 return '<div class="preview-strip" aria-label="Playable previews">'+modules.map((m,i)=>'<a href="#'+m.key+'" class="preview-link"><span class="mini-art '+m.key+'" aria-hidden="true"><svg viewBox="0 0 96 42">'+thumbnails[i]+'</svg></span><span>'+m.name+' →</span></a>').join('')+'</div>';
}
const moods=[['🎮','Play','signal'],['💡','Learn','protocol'],['✂️','Make','circuit'],['⏱️','Five minutes','signal,protocol,circuit']];
const helpPages={
 about:['🏠','About','AdigunIoT brings original browser games, explainers, and projects together in one place.'],
 updates:['📰','Updates','This review preview includes Protocol Explorer, Signal Catch, and Paper Circuit.'],
 faq:['❔','FAQ','Choose an experience to try it. Use Browse to find categories or Surprise Me to skip straight to a sample.'],
 privacy:['🔒','Privacy','This standalone preview keeps activity and layout choices in memory for this tab. It sends no activity data.'],
 terms:['📄','Terms','This review mockup contains fictional simulations and sample activities. Publication terms are pending review.'],
 feedback:['💬','Feedback','Describe the page, what you did, and what happened. Copy the note into your review conversation.']
};
let visitHistory=[],clicks=0,layout='panels';
const startedAt=Date.now();
function toolsPanel(){
 return '<div class="board-tools" aria-label="Browse options">'+routeLink('arcade','Arcade','🎮')+routeLink('moods','Moods','😊')+routeLink('updates','Updates','📰')+'<button data-layout="panels" aria-pressed="'+(layout==='panels')+'">▦ Panels</button><button data-layout="list" aria-pressed="'+(layout==='list')+'">≡ List</button></div>';
}
function endOfDirectory(){
 return '<section class="box home-note"><h2>Browse by mood</h2><div class="board-tools">'+moods.map(([icon,name],i)=>routeLink('moods/'+i,name,icon)).join('')+'</div><h2>This session</h2><div class="stats"><span>⏱️ '+Math.floor((Date.now()-startedAt)/1000)+'s elapsed</span><span>👆 '+clicks+' clicks</span><span>🧭 '+visitHistory.length+' experiences visited</span></div></section><section class="box home-note"><div class="footer-links">'+Object.entries(helpPages).map(([key,[icon,name]])=>'<a href="#'+key+'"><span aria-hidden="true">'+icon+'</span> '+name+'</a>').join('')+'<a href="#home" data-top>↑ Back to top</a></div></section>';
}
function feedbackForm(){
 return '<label for="feedback-note">Review note</label><br><textarea id="feedback-note" rows="4" maxlength="1200"></textarea><br><button data-copy-note>Copy note</button><p id="copy-status" class="sub" aria-live="polite"></p>';
}
function home(){
 const [level,key]=route.split('/');
 const group=level==='collection'?catalog.find(g=>g[1]===key):level==='category'?catalog.find(g=>g[2].some(c=>c[1]===key)):null;
 const category=level==='category'?group?.[2].find(c=>c[1]===key):null;
 const search='<div class="search"><input id="query" type="search" aria-label="Search playable experiences and menus" placeholder="Search experiences, collections or categories…"><button class="primary" data-nav="surprise">⤨ Surprise Me</button></div><div id="results" aria-live="polite" hidden></div>';
 const crumb=group?'<nav class="crumb" aria-label="Breadcrumb"><a href="#home">Home</a><span aria-hidden="true">/</span>'+ (category?'<a href="#collection/'+group[1]+'">'+group[0]+'</a><span aria-hidden="true">/</span><span>'+category[0]+'</span>':'<span>'+group[0]+'</span>')+'</nav>':'';
 const panel=(name,icon,count,description,links)=>'<article class="card"><h3><span><span class="icon" aria-hidden="true">'+icon+'</span>'+name+'</span>'+ (count===null?'':'<span class="pill">'+count+' playable</span>')+'</h3><p class="sub">'+description+'</p>'+links+'</article>';
 const categoryLink=([name,id],i)=>routeLink('category/'+id,name,categoryIcon(id,i),Number(placements.includes(id)));
 let title='Explore AdigunBoard', subtitle='10 collections · 3 playable previews', panels='';
 if(level==='arcade'){
  title='🎮 Arcade';subtitle='1 playable game';
  panels=panel('All games','🎮',1,'',link(modules[1]))+panel('Reaction & Timing','⚡',1,'',link(modules[1]));
 }else if(level==='moods'){
  const selected=/^[0-3]$/.test(key||'')?moods[Number(key)]:null;
  title=selected?selected[0]+' '+selected[1]:'😊 Browse by mood';subtitle='';
  panels=selected?panel('Try now',selected[0],null,'',modules.filter(m=>selected[2].split(',').includes(m.key)).map(link).join('')):moods.map(([icon,name],i)=>panel(name,icon,null,'',routeLink('moods/'+i,'View experiences',icon))).join('');
 }else if(Object.hasOwn(helpPages,level)){
  const [icon,name,description]=helpPages[level];title=icon+' '+name;subtitle='';
  panels=panel(name,icon,null,description,level==='feedback'?feedbackForm():'');
 }else if(category){
  const i=placements.indexOf(key), names=group[2].filter(c=>c[1]!==key);
  title=category[0];subtitle=i<0?'Planned category':'1 playable preview';
  panels=panel('Experiences',i<0?'◇':modules[i].icon,i<0?0:1,i<0?'This category has no playable preview yet.':'Open the interactive workspace.',i<0?routeLink('home','Find playable previews','⌂'):link(modules[i]))+panel('Also in '+group[0],'▦',null,'Browse another category.',names.map(categoryLink).join(''));
 }else if(group){
  title=group[0];subtitle='10 categories';
  const categories=group[2];
  panels=[categories.slice(0,5),categories.slice(5)].map((part,i)=>panel(i===0?'Categories':'More categories','▦',null,'Open a category to see its experiences.',part.map((c,j)=>categoryLink(c,j)).join(''))).join('');
  const available=modules.filter(m=>group[2].some(c=>c[1]===placements[modules.indexOf(m)]));
  if(available.length)panels+=panel('Play now','✦',available.length,'Open a featured experience.',available.map(link).join(''));
 }else{
  const recent=visitHistory.map(key=>modules.find(m=>m.key===key)).filter(Boolean);
  panels=panel('Recently added','🆕',3,'',modules.map(link).join(''))+
   '<article class="card feature-panel"><h3>✨ Play now</h3>'+featured()+'</article>'+
   (recent.length?panel('Recently visited','🕘',recent.length,'',recent.map(link).join('')+'<button data-clear-visits>Clear list</button>'):'')+
   catalog.map(([name,id,categories],i)=>{
   const playable=modules.filter((m,j)=>categories.some(c=>c[1]===placements[j]));
   return panel(name,collectionEmoji[i],playable.length,'',playable.map(link).join('')+categories.map(categoryLink).join('')+routeLink('collection/'+id,'View collection','▦'));
  }).join('');
 }
 main.innerHTML='<section class="directory">'+search+crumb+toolsPanel()+'<div id="collections" class="title-row"><h1>'+title+'</h1>'+(subtitle?'<span class="pill">'+subtitle+'</span>':'')+'</div><div class="grid full-board '+(layout==='list'?'list-layout':'')+'">'+panels+'</div>'+((route===''||route==='home')?endOfDirectory():'')+'</section>';
 const input=document.querySelector('#query'),result=document.querySelector('#results');
 input.addEventListener('input',()=>{
  const query=input.value.trim().toLowerCase();
  result.hidden=!query;
  if(!query){result.innerHTML='';return;}
  const matches=modules.filter(m=>(m.name+' '+m.pitch).toLowerCase().includes(query)).map(link);
  for(const [name,id,categories] of catalog){
   if(name.toLowerCase().includes(query))matches.push(routeLink('collection/'+id,name,'▦'));
   categories.forEach((c,i)=>{if(c[0].toLowerCase().includes(query))matches.push(categoryLink(c,i));});
  }
  result.innerHTML=matches.slice(0,8).join('')||'<p>No matching experiences or menus.</p>';
 });
 input.addEventListener('keydown',e=>{if(e.key==='Enter')result.querySelector('a')?.click();});
}
function heading(m){
 const key=placements[modules.indexOf(m)], group=catalog.find(g=>g[2].some(c=>c[1]===key)),category=group[2].find(c=>c[1]===key);
 return '<nav class="crumb" aria-label="Breadcrumb"><a href="#home">Home</a><span aria-hidden="true">/</span><a href="#collection/'+group[1]+'">'+group[0]+'</a><span aria-hidden="true">/</span><a href="#category/'+key+'">'+category[0]+'</a></nav><h1 class="work-title"><span aria-hidden="true">'+m.icon+'</span> '+m.name+'</h1><p class="muted">'+m.pitch+'</p>';
}
function protocol(){
 main.innerHTML=heading(modules[0])+'<div class="title-row"><div class="controls"><label for="scenario">Scenario</label><select id="scenario"><option>First visit</option><option>DNS answer cached</option><option>Slow reply</option></select></div></div><section class="bench" aria-label="Protocol workbench"><aside class="box rail"><div class="eyebrow">Lesson steps</div><h2>Web request</h2><p class="sub">Choose a step to inspect.</p><div id="steps" class="steps"></div></aside><section class="diagram"><div class="stage-head"><button data-action="network" aria-pressed="true">Network</button><button data-action="sequence" aria-pressed="false">Sequence</button></div><div id="stage" class="stage" aria-label="Simulation stage"></div></section><aside class="box details"><div class="eyebrow">Event inspector</div><h2 id="event-title"></h2><p id="event-summary"></p><details><summary>Why it matters</summary><p id="event-why" class="muted"></p><p class="sub lab-note">Synthetic traffic. Simplified web request.</p></details></aside><section class="box log"><h2>Packet timeline</h2><div class="legend" aria-label="Event types"><span class="kind-dns">DNS</span><span class="kind-tcp">TCP</span><span class="kind-http">HTTP</span><span class="kind-wait">Wait</span></div><div class="controls toolbar"><button class="primary" data-action="play" id="play">▶ Play</button><button data-action="previous">Previous</button><button data-action="next">Next</button><button data-action="restart">Restart</button><select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><p id="progress" class="sub" aria-live="polite"></p><div id="events" class="events"></div></section></section>';
 document.querySelector('#scenario').onchange=e=>{stop();scenario=e.target.selectedIndex;currentEvent=-1;draw();};
 document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);if(playing)schedule();};
 draw();
}
const devices=[
 '<path d="M8 41V14l38-9v29L8 41zM8 41l12 10 38-8-12-9M15 18l24-5v16l-24 5zM22 44l20-5"/>',
 '<path d="M5 24l29-10 23 10-29 11zM5 24v14l23 11 29-11V24M28 35v14M32 14V5m-5 26 15-6m-28 7v5m6-2v5"/><circle cx="32" cy="5" r="2"/>',
 '<path d="M12 15l19-9 21 10-21 9zM12 15v32l19 10 21-10V16M31 25v32M12 26l19 10 21-10M12 36l19 10 21-10m-35-6 7 4m-7 6 7 4"/>',
 '<path d="M13 12l25-7 14 8v41l-25 6-14-8zm0 0 14 8 25-7M27 20v40m5-35 15-4v8l-15 4zm0 14 15-4v8l-15 4zm0 13 15-4m-31-27 7 4m-7 5 7 4m-7 5 7 4"/>'
];
function device(index){
 return '<svg class="device-art" viewBox="0 0 64 64" fill="#1c2a44" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+devices[index]+'</svg>';
}
function packet(item,point){
 if(!item)return '';
 const from=item[2],to=item[3],nodes=from===to?[from]:from!=='Gateway'&&to!=='Gateway'?[from,'Gateway',to]:[from,to];
 const coords=nodes.map(point), endpoint=coords.at(-1),d=coords.map((xy,i)=>(i===0?'M':'L')+xy.join(' ')).join('');
 return '<svg class="map-lines packet-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="active-path" d="'+d+'"/>'+ (coords.length>1?'<circle class="packet-moving" r="1.3"><animateMotion dur="'+(0.55/speed)+'s" path="'+d+'" fill="freeze"/></circle><circle class="packet-still" r="1.3" cx="'+endpoint[0]+'" cy="'+endpoint[1]+'"/>':'<circle r="1.3" cx="'+endpoint[0]+'" cy="'+endpoint[1]+'"/>')+'</svg>';
}
function draw(){
 const list=events(),item=list[currentEvent],nodes=['Browser','Gateway','Resolver','Origin'];
 const stage=document.querySelector('#stage');if(!stage)return;
 const positions=[[12,66],[37,46],[66,23],[86,64]];
 const point=n=>positions[nodes.indexOf(n)];
 stage.innerHTML=mode==='network'?'<div class="network"><svg class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M12 66L37 46L66 23M37 46L86 64"/></svg>'+nodes.map((n,i)=>'<div class="node '+(item?.slice(2,4).includes(n)?'active':'')+'" style="left:'+positions[i][0]+'%;top:'+positions[i][1]+'%">'+device(i)+'<b>'+n+'</b></div>').join('')+packet(item,point)+'</div>':'<div class="sequence">'+list.map((e,i)=>'<div class="'+(i===currentEvent?'active':'')+'">'+(i+1)+'. '+e[2]+' → '+e[3]+' · '+e[1]+'</div>').join('')+'</div>';
 document.querySelector('#event-title').textContent=item?item[1]+' · '+item[0]+' s':'Ready to begin';
 document.querySelector('#event-summary').textContent=item?item[4]:'What happens before a website appears?';
 document.querySelector('#event-why').textContent=item?item[5]:'Press Play or select an event to see what happens.';
 const updateList=(id,markup)=>{const container=document.querySelector(id);const focused=document.activeElement?.dataset.event;const restore=container.contains(document.activeElement);container.innerHTML=markup;if(restore)container.querySelector('[data-event="'+focused+'"]')?.focus({preventScroll:true});};
 updateList('#steps',list.map((e,i)=>'<button data-event="'+i+'" aria-pressed="'+(i===currentEvent)+'" aria-label="Step '+(i+1)+': '+e[4]+'"><span class="step-number">'+(i+1)+'</span>'+e[4]+'</button>').join(''));
 updateList('#events','<div class="event column-head" aria-hidden="true"><span>#</span><span>Time</span><span class="endpoint">From</span><span class="endpoint">To</span><span>Type</span><span>Event</span></div>'+list.map((e,i)=>'<button class="event '+(i===currentEvent?'selected':'')+'" aria-pressed="'+(i===currentEvent)+'" data-event="'+i+'"><span>'+(i+1)+'</span><span>'+e[0]+'s</span><span class="endpoint">'+e[2]+'</span><span class="endpoint">'+e[3]+'</span><strong class="kind kind-'+e[1].toLowerCase()+'">'+e[1]+'</strong><span>'+e[4]+'</span></button>').join(''));
 document.querySelector('#progress').textContent=playing?'Playing · '+(currentEvent+1)+' / '+list.length:'Step '+(currentEvent+1)+' of '+list.length+(currentEvent===list.length-1?' · Complete':'');
 document.querySelector('#play').textContent=playing?'Ⅱ Pause':'▶ Play';
 for(const view of ['network','sequence'])document.querySelector('[data-action="'+view+'"]').setAttribute('aria-pressed',String(mode===view));
}
function stop(){clearTimeout(timer);timer=null;playing=false;}
function advance(){
 if(!playing)return;
 currentEvent++;
 if(currentEvent>=events().length-1)stop();
 draw();if(playing)schedule();
}
function schedule(){clearTimeout(timer);timer=setTimeout(advance,1100/speed);}
function signal(){main.innerHTML=heading(modules[1])+'<section class="box demo"><h2>Catch the pulse</h2><p class="muted">Tap the lit pad or press 1–4. You have 20 seconds.</p><div class="pads">'+[0,1,2,3].map(i=>'<button class="pad" data-pad="'+i+'" aria-label="Pad '+(i+1)+'">'+(i+1)+'</button>').join('')+'</div><div class="controls"><button class="primary" data-action="round">Start round</button><strong id="score" aria-live="polite">Score: 0</strong></div></section>';}
function signalTick(){
 if(!running)return;
 if(Date.now()>=endsAt){running=false;hot=-1;paintPads();document.querySelector('#score').textContent='Round complete · Score: '+score;return;}
 hot=(lastHot+1+Math.floor(Math.random()*3))%4;lastHot=hot;paintPads();
 roundTimer=setTimeout(signalTick,Math.min(850,endsAt-Date.now()));
}
function paintPads(){document.querySelectorAll('[data-pad]').forEach(b=>{const active=Number(b.dataset.pad)===hot;b.classList.toggle('hot',active);b.textContent=active?'✦':Number(b.dataset.pad)+1;});}
function catchPad(i){if(!running||i!==hot)return;hot=-1;score++;paintPads();document.querySelector('#score').textContent='Score: '+score;}
function circuit(){main.innerHTML=heading(modules[2])+'<section class="box demo"><h2>Light the virtual LED</h2><p class="muted">Add a foil path, orient the LED, then close the switch.</p><div id="led" class="led" aria-hidden="true">LED</div><div class="controls"><button data-action="foil"></button><button data-action="polarity"></button><button data-action="switch"></button><button data-action="reset-circuit">Reset</button></div><p id="circuit-state" class="muted" aria-live="polite"></p></section>';drawCircuit();}
function drawCircuit(){const on=foil&&closed&&!reverse;document.querySelector('#led').classList.toggle('on',on);document.querySelector('[data-action="foil"]').textContent=foil?'Remove foil':'Add foil';document.querySelector('[data-action="polarity"]').textContent=reverse?'LED: reversed':'LED: forward';document.querySelector('[data-action="switch"]').textContent=closed?'Open switch':'Close switch';document.querySelector('#circuit-state').textContent=on?'Closed loop · The LED is on.':!foil||!closed?'Open loop · Current has no complete path.':'Closed loop · The LED is reversed.';}
function render(){
 stop();clearTimeout(roundTimer);running=false;round=0;score=0;hot=-1;lastHot=-1;
 currentEvent=-1;scenario=0;mode='network';speed=1;foil=false;reverse=false;closed=false;
 const previous=route;route=location.hash.slice(1);if(modules.some(m=>m.key===route))visitHistory=[route,...visitHistory.filter(key=>key!==route)].slice(0,6);document.body.classList.toggle('home-view',!modules.some(m=>m.key===route));document.body.classList.toggle('protocol-view',route==='protocol');
 if(route==='protocol')protocol();else if(route==='signal')signal();else if(route==='circuit')circuit();else home();
 window.scrollTo(0,0);if(previous){const title=main.querySelector('h1');title.tabIndex=-1;title.focus({preventScroll:true});}
}
function showHome(target){if(route===''||route==='home'){target();return;}window.addEventListener('hashchange',target,{once:true});location.hash='home';}
document.addEventListener('click',e=>{
 if(e.target.closest('a,button'))clicks++;
 if(e.target.closest('[data-top]'))window.scrollTo(0,0);
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.layout){layout=button.dataset.layout;home();document.querySelector('[data-layout="'+layout+'"]')?.focus();return;}
 if(button.hasAttribute('data-clear-visits')){visitHistory=[];home();document.querySelector('#query')?.focus();return;}
 if(button.hasAttribute('data-copy-note')){const field=document.querySelector('#feedback-note'),note=field.value.trim(),status=document.querySelector('#copy-status');if(!note){status.textContent='Add a note first.';return;}Promise.resolve().then(()=>navigator.clipboard.writeText(note)).then(()=>{status.textContent='Note copied.';}).catch(()=>{field.select();status.textContent='Copy the selected note with Ctrl/Cmd+C.';});return;}
 const {nav,action,event,pad}=button.dataset;
 if(nav==='home')location.hash='home';
 if(nav==='browse')showHome(()=>document.querySelector('#collections').scrollIntoView());
 if(nav==='search')showHome(()=>document.querySelector('#query').focus());
 if(nav==='surprise'){const list=modules.filter(m=>m.key!==route);location.hash=list[Math.floor(Math.random()*list.length)].key;}
 if(event!==undefined){stop();currentEvent=Number(event);draw();}
 if(pad!==undefined)catchPad(Number(pad));
 if(!action)return;
 if(route==='protocol'){
  if(action==='network'||action==='sequence')mode=action;
  if(action==='play'){if(playing)stop();else{if(currentEvent===events().length-1)currentEvent=-1;playing=true;schedule();}}
  if(action==='previous'){stop();currentEvent=Math.max(-1,currentEvent-1);}
  if(action==='next'){stop();currentEvent=Math.min(events().length-1,currentEvent+1);}
  if(action==='restart'){stop();currentEvent=-1;}
  draw();
 }
 if(route==='signal'&&action==='round'){clearTimeout(roundTimer);round++;running=true;score=0;endsAt=Date.now()+20000;button.textContent='Restart round';document.querySelector('#score').textContent='Score: 0';signalTick();}
 if(route==='circuit'){if(action==='foil')foil=!foil;if(action==='polarity')reverse=!reverse;if(action==='switch')closed=!closed;if(action==='reset-circuit')foil=reverse=closed=false;drawCircuit();}
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showHome(()=>document.querySelector('#query').focus());}
 if(route==='signal'&&/^[1-4]$/.test(e.key)&&!e.repeat)catchPad(Number(e.key)-1);
});
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
