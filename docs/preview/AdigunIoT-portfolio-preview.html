<style>
:root{color-scheme:light;--ink:#161a32;--muted:#545c76;--violet:#5634a0;--line:#d7dbed;--paper:#fff;--ground:#f2f3fb}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #5634a0;outline-offset:3px}header{border-bottom:1px solid var(--line);background:white}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:10px}.wrap{max-width:1190px;margin:auto;padding-inline:16px}.brand{font-weight:850;font-size:21px}.flag{color:var(--muted);font-size:12px}.chip,.action{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:white;min-height:44px;cursor:pointer}.action{background:var(--violet);color:white;font-weight:650}.search{display:flex;gap:6px;margin:14px 0 9px}.search input{min-width:100px;flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);background:white}.filters{display:flex;gap:6px;overflow:auto;padding:4px 3px 8px}.filters .chip{white-space:nowrap}.chip[aria-pressed=true]{background:#e7defa;border-color:var(--violet);color:#37246f}h1,h2,p{margin:0}h1{font-size:clamp(24px,4vw,40px);letter-spacing:-.045em}.title{margin:8px 0 13px}.title p,.muted{color:var(--muted)}h2{font-size:17px;letter-spacing:-.02em}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.panel{border:1px solid var(--line);border-radius:11px;background:white;padding:10px 13px;min-width:0;box-shadow:0 2px 0 #dedff0}.panel h2{color:#39256d;margin:0 0 5px}.row{display:flex;min-height:44px;align-items:center;gap:8px;padding:4px 2px;border-top:1px solid #edf0f7}.row:hover,.mini:hover,.slot:hover{background:#f4effd}.row:focus-visible,.slot:focus-visible{position:relative;z-index:1}.row .icon{width:23px;text-align:center;flex:none}.row .count{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.row .arrow{color:var(--violet);font-weight:750}.samples{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:9px 0 14px}.mini{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:7px;border:1px solid var(--line);background:white;padding:6px 8px;border-radius:8px;min-height:58px;font-weight:700;font-size:13px}.mini .art{font-size:22px;background:#ebe4fa;border-radius:6px;padding:4px}.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:13px 0;color:var(--muted)}.crumb a{text-decoration:underline}.slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:12px 0}.slot{display:grid;align-content:center;text-align:center;gap:2px;min-height:56px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--muted);font-size:12px;padding:3px}.slot strong{color:var(--ink);font-size:15px}.slot.proposed{border-color:#9f86d0;background:#eee7fa;color:#4b3182}.slot.selected{outline:3px solid var(--violet);outline-offset:1px}.site{margin:12px 0}.site .action{margin-top:9px}.site-id{font:12px ui-monospace,monospace;color:var(--muted)}footer{margin:22px auto;padding-bottom:20px;color:var(--muted);font-size:13px}footer a{text-decoration:underline}.empty{margin:14px 0}.skip{position:absolute;left:-200vw}.skip:focus{left:15px;top:5px;background:white;padding:8px;z-index:10}
@media(max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.slots{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(max-width:620px){.board{grid-template-columns:1fr}.samples{grid-template-columns:repeat(2,minmax(0,1fr))}.slots{grid-template-columns:repeat(5,minmax(0,1fr))}.wrap{padding-inline:11px}.search{margin-top:10px}}

<script>
'use strict';
const groups=[{"title":"Systems & Engineering","key":"systems-engineering","icon":"⚙️","cats":[{"title":"Internet & Protocols","key":"internet-protocols","lead":"Adigun Protocol Explorer"},{"title":"Signals & Wireless","key":"signals-wireless","lead":"Signal Path Finder"},{"title":"Computers & Operating Systems","key":"computers-operating-systems","lead":"Task Switch Viewer"},{"title":"Electronics & Circuits","key":"electronics-circuits","lead":"Paper Circuit"},{"title":"Sensors & Measurement","key":"sensors-measurement","lead":"Sensor Calibration Bench"},{"title":"Robotics & Motion","key":"robotics-motion","lead":"Robot Reach Sandbox"},{"title":"Automation & PLCs","key":"automation-plcs","lead":"Relay Race Board"},{"title":"Energy & Power Grids","key":"energy-power-grids","lead":"Grid Balance Room"},{"title":"Machines & Mechanisms","key":"machines-mechanisms","lead":"Gear Ratio Bench"},{"title":"Transport & Navigation","key":"transport-navigation","lead":"Route and Compass"}]},{"title":"Arcade & Challenges","key":"arcade-challenges","icon":"🎮","cats":[{"title":"Arcade","key":"arcade","lead":"Signal Catch"},{"title":"Reaction & Timing","key":"reaction-timing","lead":"Tap Window"},{"title":"Logic & Deduction","key":"logic-deduction","lead":"Alibi Grid"},{"title":"Memory & Attention","key":"memory-attention","lead":"Memory Lanterns"},{"title":"Spatial Puzzles","key":"spatial-puzzles","lead":"Shape Packing Desk"},{"title":"Number Puzzles","key":"number-puzzles","lead":"Number Bridge"},{"title":"Strategy Boards","key":"strategy-boards","lead":"Territory Lines"},{"title":"Daily Challenges","key":"daily-challenges","lead":"Puzzle of the Day"},{"title":"Pattern Spotting","key":"pattern-spotting","lead":"Pattern Break"},{"title":"Trivia","key":"trivia","lead":"Fact or Fiction"}]},{"title":"DIY & Making","key":"diy-making","icon":"🛠️","cats":[{"title":"DIY & Making Projects","key":"diy-making-projects","lead":"Fold and Try"},{"title":"Paper & Cardboard","key":"paper-cardboard","lead":"Paper Bridge Studio"},{"title":"Wood & Workshop","key":"wood-workshop","lead":"Workshop Joints"},{"title":"Textiles & Stitching","key":"textiles-stitching","lead":"Stitch Sampler"},{"title":"Recycling & Repair","key":"recycling-repair","lead":"Repair Decision Tree"},{"title":"Kitchen Science & Food Making","key":"kitchen-science-food-making","lead":"Kitchen Measure Lab"},{"title":"Garden & Growing","key":"garden-growing","lead":"Seed Planner"},{"title":"Models & Prototyping","key":"models-prototyping","lead":"Prototype Workbench"},{"title":"Photography & Optics","key":"photography-optics","lead":"Pinhole Camera Lab"},{"title":"Home Organization","key":"home-organization","lead":"Desk Layout Planner"}]},{"title":"Science & Nature","key":"science-nature","icon":"🪐","cats":[{"title":"Space & Astronomy","key":"space-astronomy","lead":"Orbit Table"},{"title":"Physics Playgrounds","key":"physics-playgrounds","lead":"Pendulum Playground"},{"title":"Chemistry Models","key":"chemistry-models","lead":"Molecule Shape Bench"},{"title":"Earth & Geology","key":"earth-geology","lead":"Rock Layer Detective"},{"title":"Weather & Climate","key":"weather-climate","lead":"Cloud Forecast Desk"},{"title":"Life & Cells","key":"life-cells","lead":"Cell Transport Viewer"},{"title":"Human Body & Senses","key":"human-body-senses","lead":"Sound and Hearing Lab"},{"title":"Oceans & Water","key":"oceans-water","lead":"Ocean Depth Desk"},{"title":"Animals & Ecosystems","key":"animals-ecosystems","lead":"Habitat Balance"},{"title":"Materials Science","key":"materials-science","lead":"Material Strength Bench"}]},{"title":"Creative Studio","key":"creative-studio","icon":"🎨","cats":[{"title":"Pixel Art & Sprites","key":"pixel-art-sprites","lead":"Pixel Sprite Studio"},{"title":"Drawing & Illustration","key":"drawing-illustration","lead":"Sketch Shapes"},{"title":"Animation & Motion","key":"animation-motion","lead":"Motion Frame Studio"},{"title":"Generative Art","key":"generative-art","lead":"Pattern Garden"},{"title":"Color & Design","key":"color-design","lead":"Palette Mixer"},{"title":"Sound & Music","key":"sound-music","lead":"Tone Workshop"},{"title":"Beat & Rhythm","key":"beat-rhythm","lead":"Beat Grid"},{"title":"Writing & Story","key":"writing-story","lead":"Story Branch Builder"},{"title":"Words & Language","key":"words-language","lead":"Word Ladder Lab"},{"title":"Creative Generators","key":"creative-generators","lead":"Prompt Jar"}]},{"title":"Web & Digital Worlds","key":"web-digital-worlds","icon":"🌐","cats":[{"title":"Homepage Builder","key":"homepage-builder","lead":"My Corner Builder"},{"title":"Retro Computing","key":"retro-computing","lead":"Retro Terminal Room"},{"title":"Web History","key":"web-history","lead":"Web Time Capsule"},{"title":"Interactive Toys","key":"interactive-toys","lead":"Tiny Machines"},{"title":"Virtual Worlds","key":"virtual-worlds","lead":"Island Builder"},{"title":"Multiplayer & Social","key":"multiplayer-social","lead":"Shared Doodle Room"},{"title":"Data & Visualization","key":"data-visualization","lead":"Chart Detective"},{"title":"Maps & Geography","key":"maps-geography","lead":"Map Layers"},{"title":"Random Discovery","key":"random-discovery","lead":"AdigunBoard"},{"title":"Curious Facts","key":"curious-facts","lead":"Curiosity Cards"}]},{"title":"AI & Digital Trust","key":"ai-digital-trust","icon":"🤖","cats":[{"title":"AI Foundations","key":"ai-foundations","lead":"Train a Shape Sorter"},{"title":"Training Data & Labels","key":"training-data-labels","lead":"Label Balance Lab"},{"title":"Model Evaluation","key":"model-evaluation","lead":"Model Scorecard"},{"title":"AI Explanations","key":"ai-explanations","lead":"Model Decision Lens"},{"title":"Text & Language AI","key":"text-language-ai","lead":"Text Classifier Bench"},{"title":"Vision & Audio AI","key":"vision-audio-ai","lead":"Sound Labeler"},{"title":"Human–AI Workflows","key":"human-ai-workflows","lead":"Human Review Desk"},{"title":"Privacy & Permissions","key":"privacy-permissions","lead":"Permission Checkup"},{"title":"Secure Habits","key":"secure-habits","lead":"Safe Settings Guide"},{"title":"Defensive Monitoring","key":"defensive-monitoring","lead":"Alert Triage Board"}]},{"title":"Money & Markets","key":"money-markets","icon":"📊","cats":[{"title":"Money & Budgeting","key":"money-budgeting","lead":"Budget Envelope"},{"title":"Interest & Compounding","key":"interest-compounding","lead":"Compound Growth Desk"},{"title":"Market Mechanics","key":"market-mechanics","lead":"Market Matchroom"},{"title":"Charts & Indicators","key":"charts-indicators","lead":"Chart Signal Lab"},{"title":"Fees & Friction","key":"fees-friction","lead":"Fee Drag"},{"title":"Risk & Uncertainty","key":"risk-uncertainty","lead":"Risk Dice"},{"title":"Diversification","key":"diversification","lead":"Portfolio Mix"},{"title":"Trading Journals","key":"trading-journals","lead":"Trading Journal Sandbox"},{"title":"Strategy Testing","key":"strategy-testing","lead":"Strategy Replay"},{"title":"Economic Signals","key":"economic-signals","lead":"Economic Signals Board"}]},{"title":"Faith & Biblical Learning","key":"faith-biblical-learning","icon":"📖","cats":[{"title":"Bible Overview","key":"bible-overview","lead":"Bible Books Atlas"},{"title":"Bible Geography","key":"bible-geography","lead":"Bible Geography Map"},{"title":"Biblical Timelines","key":"biblical-timelines","lead":"Biblical Timeline Builder"},{"title":"People of the Bible","key":"people-of-the-bible","lead":"People and Places"},{"title":"Parables","key":"parables","lead":"Parable Story Map"},{"title":"Biblical Themes","key":"biblical-themes","lead":"Theme Threads"},{"title":"Scripture Memory","key":"scripture-memory","lead":"Scripture Memory Cards"},{"title":"Bible Study Methods","key":"bible-study-methods","lead":"Passage Study Desk"},{"title":"Church & Community History","key":"church-community-history","lead":"Church History Atlas"},{"title":"Faith & Service","key":"faith-service","lead":"Service Planner"}]},{"title":"Civic Life & Society","key":"civic-life-society","icon":"🏛️","cats":[{"title":"Public Institutions","key":"public-institutions","lead":"Public Institutions Map"},{"title":"Public Budgets","key":"public-budgets","lead":"Public Budget Table"},{"title":"Elections & Representation","key":"elections-representation","lead":"Representation Builder"},{"title":"Local Government","key":"local-government","lead":"Council Agenda Room"},{"title":"How Laws Are Made","key":"how-laws-are-made","lead":"Bill Journey"},{"title":"Public Services","key":"public-services","lead":"Public Service Map"},{"title":"Rights & Responsibilities","key":"rights-responsibilities","lead":"Civic Responsibilities Cards"},{"title":"Media & Information Literacy","key":"media-information-literacy","lead":"Source Check Desk"},{"title":"Policy Trade-offs","key":"policy-trade-offs","lead":"Policy Trade-off Studio"},{"title":"Community Planning","key":"community-planning","lead":"Community Plan Board"}]}];
const categories=groups.flatMap((g,gi)=>g.cats.map((c,i)=>({...c,group:g,num:gi*10+i+1})));
const demos={
 'internet-protocols':['🌐','Adigun Protocol Explorer','protocol'],
 arcade:['🎮','Signal Catch','signal'],
 'paper-cardboard':['💡','Paper Circuit','circuit'],
 'random-discovery':['✨','AdigunBoard','home']
};
const sampleLinks=['random-discovery','internet-protocols','arcade','paper-cardboard'];
const $=s=>document.querySelector(s),view=$('#content'),lookup=$('#lookup');
const id=(c,n)=>'C'+String(c.num).padStart(2,'0')+'-'+String(n).padStart(3,'0');
const siteHref=hash=>'AdigunIoT-preview.html#'+hash;
const labels={1:'Lead concept'};
function row(c){return '<a class="row" href="#category/'+c.key+'"><span class="icon" aria-hidden="true">'+c.group.icon+'</span><span>'+c.title+'</span><span class="count">100 slots</span><span class="arrow" aria-hidden="true">›</span></a>';}
function samples(){return '<div class="samples" aria-label="Four site previews">'+sampleLinks.map(k=>{const [icon,name,hash]=demos[k];return '<a class="mini" href="'+siteHref(hash)+'"><span class="art" aria-hidden="true">'+icon+'</span>'+name+' ↗</a>';}).join('')+'</div>';}
function home(filter='all',query=''){
 const filtered=groups.filter(g=>filter==='all'||filter===g.key);
 const matches=categories.filter(c=>[c.title,c.lead,c.group.title,c.key].some(x=>x.toLowerCase().includes(query)));
 const panels=filtered.map(g=>[g,matches.filter(c=>c.group===g)]).filter(([,cats])=>cats.length).map(([g,cats])=>'<section class="panel"><h2><span aria-hidden="true">'+g.icon+'</span> '+g.title+'</h2>'+cats.map(row).join('')+'</section>').join('');
 view.innerHTML='<div class="title"><h1>Explore the portfolio</h1><p>100 categories · 10,000 website slots · 4 clickable previews</p></div>'+((!query&&filter==='all')?samples():'')+'<nav class="filters" aria-label="Filter collections"><button class="chip" data-filter="all" aria-pressed="'+(filter==='all')+'">All collections</button>'+groups.map(g=>'<button class="chip" data-filter="'+g.key+'" aria-pressed="'+(filter===g.key)+'"><span aria-hidden="true">'+g.icon+'</span> '+g.title+'</button>').join('')+'</nav><div class="board">'+(panels||'<p class="empty">No matching categories.</p>')+'</div>';
}
function category(c,n){
 const demo=demos[c.key];
 const detail=n?'<section class="panel site"><span class="site-id">'+id(c,n)+'</span><h2>'+(n===1?c.lead:'Open planning slot')+'</h2><p class="muted">'+(n===1?(demo?'Clickable Phase 0 preview':'Proposed lead site'):'Site concept to be specified after Phase 0 review.')+'</p>'+(n===1&&demo?'<a class="action" href="'+siteHref(demo[2])+'">↗ Open preview</a>':'')+'</section>':'';
 const slots=Array.from({length:100},(_,i)=>i+1).map(i=>'<a class="slot '+(i===1?'proposed ':'')+(n===i?'selected':'')+'" href="#slot/'+id(c,i)+'" aria-label="'+id(c,i)+(i===1?', '+c.lead:', open planning slot')+'"'+(n===i?' aria-current="true"':'')+'><strong>'+String(i).padStart(2,'0')+'</strong><span>'+(i===1?'★ Lead':'Open')+'</span></a>').join('');
 view.innerHTML='<nav class="crumb" aria-label="Breadcrumb"><a href="#home">Home</a><span>›</span><a href="#collection/'+c.group.key+'">'+c.group.title+'</a></nav><div class="title"><h1>'+c.group.icon+' '+c.title+'</h1><p>100 website slots · 1 lead concept · 99 open</p></div>'+(detail||'<section class="panel site"><span class="site-id">'+id(c,1)+'</span><h2>'+c.lead+'</h2><p class="muted">'+(demo?'Clickable Phase 0 preview':'Proposed lead site')+'</p><a class="action" href="'+(demo?siteHref(demo[2]):'#slot/'+id(c,1))+'">'+(demo?'↗ Open preview':'→ View lead slot')+'</a></section>')+'<nav class="slots" aria-label="All 100 website slots">'+slots+'</nav>';
}
function render(){
 const [kind,key]=location.hash.slice(1).split('/');
 if(kind==='collection'&&groups.some(g=>g.key===key)){home(key);return;}
 if(kind==='category'){const c=categories.find(c=>c.key===key);if(c){category(c);return;}}
 if(kind==='slot'){const m=/^C(\d{2,3})-(\d{3})$/.exec(key||'');if(m&&categories[+m[1]-1]&&+m[2]>=1&&+m[2]<=100){category(categories[+m[1]-1],+m[2]);return;}}
 home();
}
function search(exact){
 const q=lookup.value.trim(),m=/^c(\d{2,3})-(\d{3})$/i.exec(q);
 if(exact&&m&&categories[+m[1]-1]&&+m[2]>=1&&+m[2]<=100){location.hash='slot/'+q.toUpperCase();return;}
 home('all',q.toLowerCase());
}
lookup.addEventListener('input',()=>search(false));
lookup.addEventListener('keydown',e=>{if(e.key==='Enter')search(true);});
$('#find').addEventListener('click',()=>search(true));
view.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;location.hash=b.dataset.filter==='all'?'home':'collection/'+b.dataset.filter;});
window.addEventListener('hashchange',()=>{lookup.value='';render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});
render();
</script>
