<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Ladder Lab · AdigunIoT</title>
<style>
:root{color-scheme:dark;--ink:#f8f4ff;--muted:#c4cde5;--edge:#667ca0;--glass:#131d36e8;--mint:#8ff3db;--tile:60px;--inset:16px}
*{box-sizing:border-box}html,body,#studio{width:100vw;height:100vh;height:100dvh;overflow:hidden;margin:0}body{color:var(--ink);background:#0b1220;font:16px/1.4 system-ui,sans-serif}
button,select{color:inherit;font:inherit;cursor:pointer;background:var(--glass);border:1px solid var(--edge);border-radius:10px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#studio{position:relative}.playfield{position:absolute;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;gap:14px;padding:64px 16px 124px;background:radial-gradient(ellipse at center,#282454,#0d162a 72%);text-align:center}
.chain{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;list-style:none;padding:0;margin:0;max-width:510px}
.chain li{padding:5px 8px;border-radius:7px;background:#362965;font:700 clamp(14px,4vw,24px) ui-monospace,monospace}.chain li:last-child{background:#24554e;animation:step .2s ease-out}
.hud{position:fixed;inset:0;z-index:2;pointer-events:none}.hud button,.hud .dock{pointer-events:auto}
.stats,.upper,.dock,.actions{position:fixed;display:flex;align-items:center;gap:4px}
.stats,.upper{top:max(var(--inset),env(safe-area-inset-top))}.stats{left:max(var(--inset),env(safe-area-inset-left))}
.upper,.actions{right:max(var(--inset),env(safe-area-inset-right))}.upper button,.actions button{width:40px;height:40px;padding:0}
.pill{border:1px solid var(--edge);border-radius:20px;background:var(--glass);font:700 13px/1.25 system-ui;padding:5px 8px;white-space:nowrap}
.dock,.actions{bottom:max(var(--inset),env(safe-area-inset-bottom))}.dock{left:50%;transform:translateX(-50%);max-height:76px}.dock button{width:var(--tile);height:60px;padding:0;font:700 13px ui-monospace,monospace}
button[aria-disabled=true]{opacity:.5}button:hover{border-color:var(--mint)}
dialog{z-index:20;width:min(360px,calc(100vw - 32px));border:1px solid var(--edge);border-radius:14px;background:var(--glass);color:var(--ink);padding:18px}
dialog::backdrop{background:#080c18a6}dialog h2{margin:0 0 12px}dialog p{color:var(--muted)}dialog button,dialog select{min-height:40px;padding:0 10px}dialog a{color:var(--mint)}.identity{display:flex;gap:8px;align-items:center;margin:0 0 12px}.identity img{width:36px;height:36px;object-fit:contain;border-radius:6px}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:600px){.actions{bottom:calc(max(var(--inset),env(safe-area-inset-bottom)) + 69px)}.playfield{padding-bottom:132px}}
@media(max-width:390px){.dock{gap:0}}

@keyframes step{from{transform:scale(.78)}to{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.chain li:last-child{animation:none}}
</style>
</head>
<body>
<main id="studio" aria-label="Word Ladder Lab">
  <h1 class="visually-hidden">Word Ladder Lab</h1>
  <section class="playfield game" aria-label="Word ladder puzzle">
    <ol id="chain" class="chain" aria-label="Your word chain"></ol>
  </section>
  <div class="hud">
    <div class="stats"><span class="pill">🎯 <strong id="goal" aria-label="Goal word"></strong></span><span class="pill">👣 <span id="moves"></span></span><span class="pill" id="indicator" aria-hidden="true">💬 Ready</span></div>
    <div class="upper"><button id="help" type="button" aria-label="Help">?</button><button id="menu" type="button" aria-label="Menu">☰</button></div>
    <div class="dock" id="options" role="group" aria-label="Possible word choices"></div>
    <div class="actions"><button id="hint" type="button" aria-label="Hint">💡</button><button id="undo" type="button" aria-label="Undo" aria-disabled="true">↶</button><button id="reset" type="button" aria-label="Reset">⟳</button></div>
  </div>
  <p id="status" class="visually-hidden" role="status"></p>
  <dialog id="studio-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>

<script>
'use strict';
const $=id=>document.getElementById(id);
const puzzles=[
 {start:'COLD',goal:'WARM',words:['CORD','CARD','WARD','WARM','MOLD','WORM']},
 {start:'CAT',goal:'DOG',words:['COT','DOT','DOG','CAP','COP','COG']}
];
let path=[],choicePage=0;
const dialog=$('studio-dialog');
function showDialog(title,section,message=''){
 $('dialog-title').textContent=title;
 $('help-content').hidden=section!=='help';
 $('menu-content').hidden=section!=='menu';
 $('dialog-message').hidden=!message;
 $('dialog-message').textContent=message;
 if(!dialog.open)dialog.showModal();
}
$('help').addEventListener('click',()=>showDialog('How to play','help'));
$('menu').addEventListener('click',()=>showDialog('Menu','menu'));
function puzzle(){return puzzles[Number($('puzzle').value)];}
function oneLetter(a,b){return a.length===b.length&&[...a].filter((letter,index)=>letter!==b[index]).length===1;}
function hint(){
 const {goal,words}=puzzle(),current=path.at(-1);
 const seen=new Set(path),queue=[[current,null]];
 for(const [word,first] of queue){
  if(word===goal)return first;
  for(const next of words){
   if(seen.has(next)||!oneLetter(word,next))continue;
   seen.add(next);queue.push([next,first||next]);
  }
 }
 return null;
}
function draw(note){
 const {goal,words}=puzzle(),won=path.at(-1)===goal;
 const active=document.activeElement?.dataset.word;
 $('goal').textContent=goal;
 $('chain').innerHTML=path.map(word=>'<li>'+word+'</li>').join('');
 $('options').innerHTML=words.slice(choicePage*3,choicePage*3+3).map(word=>'<button type="button" data-word="'+word+'" aria-disabled="'+(won||path.includes(word))+'">'+word+'</button>').join('')+'<button type="button" data-page aria-label="More words">↔ '+(choicePage+1)+'/2</button>';
 $('moves').textContent=path.length-1;
 $('moves').setAttribute('aria-label',(path.length-1)+' moves');
 $('indicator').textContent=won?'🏆 Won':note==='Change exactly one letter.'?'⚠️ Retry':'💬 Ready';
 $('status').textContent=won?'':note;
 $('hint').setAttribute('aria-disabled',String(won));
 $('undo').setAttribute('aria-disabled',String(path.length<=1));
 if(won)showDialog('Ladder complete','',note);else if(active)$('options').querySelector('[data-word="'+active+'"]')?.focus();
}
function reset(){choicePage=0;path=[puzzle().start];draw('Choose your next word.');}
$('options').addEventListener('click',e=>{
 if(e.target.closest('[data-page]')){choicePage=1-choicePage;draw($('status').textContent);$('options').querySelector('[data-page]').focus();return;}
 const option=e.target.closest('button[data-word]');if(!option||option.getAttribute('aria-disabled')==='true')return;
 const word=option.dataset.word;
 if(!oneLetter(path.at(-1),word)){draw('Change exactly one letter.');return;}
 path.push(word);draw(word===puzzle().goal?'Ladder complete in '+(path.length-1)+' moves!':'Good step. Keep going.');
});
$('hint').addEventListener('click',()=>{
 if(path.at(-1)===puzzle().goal)return;
 const next=hint();showDialog('Hint','',next?'Try '+next+'.':'No unused route from here. Undo a step.');
});
$('undo').addEventListener('click',()=>{if(path.length>1){path.pop();draw('Step undone.');}});
$('puzzle').addEventListener('change',()=>{dialog.close();reset();});
$('reset').addEventListener('click',reset);
if(location.protocol==='file:')$('portfolio').href='../../AdigunIoT-portfolio-preview.html#category/words-language';
reset();
</script>
