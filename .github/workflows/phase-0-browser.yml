          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-0-browser-screens
          path: '*-*.png'
          if-no-files-found: ignore
      - name: Stage verified site files
        id: stage
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p _site/docs/preview
          cp index.html CNAME _site/
          cp -r sites _site/
          cp docs/preview/AdigunIoT-portfolio-preview.html _site/docs/preview/
          echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        id: package
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: _site
          name: ${{ steps.stage.outputs.name }}
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: adiguniot-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Verify the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.preview.outputs.pages_artifact_id }}
          PAGES_ARTIFACT_NAME: ${{ needs.preview.outputs.pages_artifact_name }}
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]] || [[ -z "$PAGES_ARTIFACT_NAME" ]]; then
            echo "Verified build did not return a Pages artifact." >&2
            exit 1
          fi
          for attempt in {1..15}; do
            if metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAGES_ARTIFACT_ID" --jq '[.name,.workflow_run.id,.expired] | @tsv') &&
              [[ "$metadata" == "$PAGES_ARTIFACT_NAME"$'\t'"$GITHUB_RUN_ID"$'\t'false ]]; then
              exit 0
            fi
            sleep 4
          done
          echo "Pages artifact $PAGES_ARTIFACT_ID did not become available." >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: publish
        with:
          artifact_name: ${{ needs.preview.outputs.pages_artifact_name }}
