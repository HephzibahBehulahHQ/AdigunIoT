name: Verify and deploy AdigunIoT
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'CNAME'
      - 'docs/preview/AdigunIoT-portfolio-preview.html'
      - '.github/workflows/phase-0-browser.yml'
  pull_request:
    paths:
      - 'docs/preview/AdigunIoT-portfolio-preview.html'
      - 'index.html'
      - '.github/workflows/phase-0-browser.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tools in runner temp
        run: |
          npm install --prefix "$RUNNER_TEMP/adigun-qa" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/adigun-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise phone and laptop routes
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require(process.env.RUNNER_TEMP + '/adigun-qa/node_modules/playwright');
          const entry = fs.readFileSync('index.html', 'utf8');
          const html = fs.readFileSync('docs/preview/AdigunIoT-portfolio-preview.html', 'utf8');
          async function withinViewport(locator) {
            assert.equal(await locator.evaluate(e => e.scrollWidth <= e.clientWidth + 2), true, 'horizontal overflow');
          }
          (async () => {
            const browser = await chromium.launch();
            try {
              for (const [name, viewport] of [['phone', {width: 390, height: 844}], ['laptop', {width: 1366, height: 768}]]) {
                const context = await browser.newContext({ viewport, reducedMotion: name === 'phone' ? 'reduce' : 'no-preference', hasTouch: name === 'phone' });
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', error => errors.push(error.message));
                await page.route('**/*', route => {
                  const url = new URL(route.request().url());
                  if (url.origin !== 'https://adigun.test') return route.abort();
                  const body = url.pathname === '/' ? entry :
                    url.pathname === '/docs/preview/AdigunIoT-portfolio-preview.html' ? html : null;
                  return body ? route.fulfill({contentType:'text/html; charset=utf-8', body}) : route.abort();
                });
                await page.goto('https://adigun.test/');
                await page.waitForURL('**/AdigunIoT-portfolio-preview.html');
                assert.equal(await page.locator('.board > .panel').count(), 30);
                await withinViewport(page.locator('html'));
                await page.screenshot({ path: name + '-portfolio.png' });
                await page.locator('.samples').getByRole('link', { name: /AdigunBored/ }).click();
                const frame = page.frameLocator('.demo-frame');
                await frame.getByRole('heading', { name: /AdigunBored/ }).first().waitFor();
                await withinViewport(frame.locator('html'));
                assert.equal(await frame.locator('.bored-grid > .card').count(), 30);
                await page.screenshot({ path: name + '-board.png' });
                await frame.getByRole('link', { name: /Play & Learn/ }).first().click();
                await frame.getByRole('link', { name: /How DNS Resolves/ }).click();
                await frame.getByRole('button', { name: 'Server' }).click();
                await frame.getByText('Try another answer.').waitFor();
                await frame.getByRole('button', { name: 'Cache' }).click();
                await frame.getByText(/avoids an extra network lookup/).waitFor();
                await frame.getByRole('button', { name: 'Reset' }).click();
                assert.equal(await frame.locator('#learning-result').textContent(), '');
                await withinViewport(frame.locator('html'));
                await page.screenshot({ path: name + '-activity.png' });
                await page.waitForURL(/#demo\/home\/concept\/0\/1$/);
                await page.goBack();
                await frame.getByRole('heading', { name: /Play & Learn/ }).waitFor();
                await frame.getByRole('link', { name: 'Bubble Calendar' }).click();
                await page.waitForURL(/#demo\/home\/concept\/19\/3$/);
                const direct = page.url();
                await page.reload();
                await frame.getByRole('button', { name: 'First', exact: true }).click();
                await frame.getByText('Popped 1 of 6.').waitFor();
                for (const label of ['Second','Third','Fourth','Fifth','Sixth']) await frame.getByRole('button', { name: label, exact: true }).click();
                await frame.getByText('Blue, purple, yellow repeats twice.').waitFor();
                assert.equal(page.url(), direct);
                await withinViewport(frame.locator('html'));
                await frame.getByRole('link', { name: /Play & Learn/ }).first().click();
                await frame.getByRole('link', { name: 'Paper Moon Spinner' }).click();
                await frame.getByRole('button', { name: 'Full', exact: true }).click();
                await frame.getByText('The lit side faces Earth.').waitFor();
                await frame.getByRole('link', { name: /Play & Learn/ }).first().click();
                await frame.getByRole('link', { name: 'Mini Magnet March' }).click();
                await frame.getByRole('button', { name: 'Iron nail' }).click();
                await frame.getByText('The iron nail moves toward the magnet.').waitFor();
                await frame.getByRole('button', { name: /Reset/ }).click();
                await frame.getByText('Reset.', {exact:true}).waitFor();
                await frame.getByRole('link', { name: 'Arcade', exact: true }).first().click();
                await frame.getByRole('link', { name: 'All games', exact: true }).first().click();
                await frame.getByRole('link', { name: 'Memory Grid', exact: true }).click();
                const card = n => frame.getByRole('button', { name: new RegExp('^Card ' + n + ' ·') });
                await card(1).press('Enter');
                await card(2).click();
                await frame.getByText(/Different cards/).waitFor();
                for (const n of [3,6,1,4,2,7,5,8]) await card(n).click();
                await frame.getByText(/all four pairs in 5 turns/).waitFor();
                await frame.getByRole('button', { name: /Replay/ }).click();
                await frame.getByText('New game.').waitFor();
                await withinViewport(frame.locator('html'));
                await frame.getByRole('link', { name: 'Arcade', exact: true }).first().click();
                await frame.getByRole('link', { name: 'All games', exact: true }).first().click();
                await frame.getByRole('link', { name: 'Color Match', exact: true }).click();
                await frame.getByRole('button', { name: 'Blue', exact: true }).click();
                await frame.getByText('Try another shade.').waitFor();
                for (const color of ['Amber','Purple','Rose','Teal','Blue']) await frame.getByRole('button', { name: color, exact: true }).click();
                await frame.getByText('All five colors matched. Misses: 1.').waitFor();
                await withinViewport(frame.locator('html'));
                await page.screenshot({ path: name + '-arcade.png' });
                await frame.getByRole('link', { name: 'Play Now', exact: true }).click();
                await page.waitForURL(/#demo\/home\/play-now$/);
                await frame.getByText('19 playable', {exact:true}).waitFor();
                assert.equal(await frame.locator('.bored-grid .open').count(), 19);
                await frame.getByRole('link', { name: 'Word Snake', exact: true }).click();
                await frame.getByRole('button', { name: 'Goat', exact: true }).click();
                await frame.getByText('Find an unused word starting with N.').waitFor();
                for (const choice of ['Nest','Tree','Egg','Goat','Train']) await frame.getByRole('button', { name: choice, exact: true }).click();
                await frame.getByText('Chain complete! You linked five words.').waitFor();
                await withinViewport(frame.locator('html'));
                await frame.getByRole('link', { name: 'Arcade', exact: true }).click();
                await frame.getByRole('button', { name: /Surprise Me/ }).click();
                await page.waitForURL(url => /#demo\/home\/(?:protocol|signal|circuit|relay|budget|calibration|grid-balance|concept\/\d+\/\d+)$/.test(url.hash) && !url.hash.endsWith('/1/2'));
                assert.equal(await frame.getByText('In the build queue.').count(), 0);
                await page.getByRole('link', { name: 'Back to portfolio' }).click();
                await page.locator('.samples').getByRole('link', { name: /Protocol Explorer/ }).click();
                await frame.getByRole('heading', { name: 'Packet timeline' }).waitFor();
                await frame.getByRole('button', { name: 'Next', exact: true }).click();
                await frame.getByText(/0.000 s/).waitFor();
                await frame.getByRole('button', { name: 'Sequence', exact: true }).click();
                await frame.locator('.sequence .active').waitFor();
                await withinViewport(frame.locator('html'));
                await page.getByRole('link', { name: 'Back to portfolio' }).click();
                await page.getByRole('link', { name: /Automation & PLCs 100 slots/ }).first().click();
                await page.getByRole('link', { name: /Open preview/ }).click();
                await frame.getByRole('heading', { name: /Relay Race Board/ }).waitFor();
                await frame.getByText('BY HB ELEKTRONIKER').waitFor();
                const guard = frame.getByRole('button', { name: 'Guard' });
                const demand = frame.getByRole('button', { name: 'Demand' });
                await guard.press('Enter');
                await frame.getByText('Lamp off · Close both switches.').waitFor();
                await demand.click();
                await frame.getByText('Lamp on · Relay energized.').waitFor();
                await guard.click();
                await frame.getByLabel('Wiring').selectOption('parallel');
                await frame.getByText('Lamp on · Relay energized.').waitFor();
                await frame.getByRole('button', { name: /Reset/ }).click();
                await frame.getByText('Lamp off · Close both switches.').waitFor();
                await withinViewport(frame.locator('html'));
                await page.screenshot({ path: name + '-relay.png' });
                await page.getByRole('link', {name: 'Back to portfolio'}).click();
                await page.getByRole('link', {name: 'Home', exact: true}).click();
                await page.getByRole('link', {name: /Public Budgets 100 slots/}).first().click();
                await page.getByRole('link', {name: /Open preview/}).click();
                await frame.getByRole('heading', {name: /Public Budget Table/}).waitFor();
                await frame.getByText('BY HB POLITICS').waitFor();
                const addLibrary = frame.getByRole('button', {name: 'Add one point to Libraries'});
                const addTransit = frame.getByRole('button', {name: 'Add one point to Transit'});
                await addLibrary.press('Enter');
                for (let n=1;n<12;n++) await addLibrary.click();
                await frame.getByText(/All 12 points allocated/).waitFor();
                assert.equal(await addTransit.getAttribute('aria-disabled'), 'true');
                await frame.getByRole('button', {name: 'Remove one point from Libraries'}).click();
                await addTransit.click();
                await frame.getByText(/All 12 points allocated/).waitFor();
                assert.equal(await frame.locator('#budget-points-1').textContent(), '1 pts');
                await frame.getByRole('button', {name: /Reset budget/}).click();
                await frame.getByText('12 of 12 points available.').waitFor();
                await withinViewport(frame.locator('html'));
                await page.screenshot({path: name + '-budget.png'});
                await page.getByRole('link', {name: 'Back to portfolio'}).click();
                await page.getByRole('link', {name: 'Home', exact: true}).click();
                await page.getByRole('link', {name: /Sensors & Measurement 100 slots/}).first().click();
                await page.getByRole('link', {name: /Open preview/}).click();
                await frame.getByRole('heading', {name: /Sensor Calibration Bench/}).waitFor();
                const verify = frame.getByRole('button', {name: /Verify at 25/});
                assert.equal(await verify.getAttribute('aria-disabled'), 'true');
                await frame.getByRole('button', {name: /Capture 30/}).press('Enter');
                await frame.getByText('Sensor shows 40.0 °C.').waitFor();
                assert.equal(await verify.getAttribute('aria-disabled'), 'true');
                await frame.getByRole('button', {name: /Capture 10/}).click();
                await verify.click();
                await frame.getByText('Raw 34.0 °C → corrected 25.0 °C.').waitFor();
                await withinViewport(frame.locator('html'));
                await page.screenshot({path: name + '-calibration.png'});
                await frame.getByRole('button', {name: /Reset/}).click();
                assert.equal(await verify.getAttribute('aria-disabled'), 'true');
                await page.getByRole('link', {name: 'Back to portfolio'}).click();
                await page.getByRole('link', {name: 'Home', exact: true}).click();
                await page.getByRole('link', {name: /Energy & Power Grids 100 slots/}).first().click();
                await page.getByRole('link', {name: /Open preview/}).click();
                await frame.getByRole('heading', {name: /Grid Balance Room/}).waitFor();
                const solar = frame.getByRole('slider', {name: /Solar/});
                const dispatch = frame.getByRole('slider', {name: /Dispatchable supply/});
                await solar.press('End');
                await dispatch.press('ArrowRight');
                await dispatch.press('ArrowRight');
                await frame.getByText('Supply 8 · Demand 8 · Balanced!').waitFor();
                await frame.getByLabel('Scenario', {exact:true}).selectOption('evening');
                await frame.getByText('Supply 4 · Demand 9 · 5 units short.').waitFor();
                await dispatch.press('End');
                await frame.getByText('Supply 10 · Demand 9 · 1 unit extra.').waitFor();
                await dispatch.press('ArrowLeft');
                await frame.getByText('Supply 9 · Demand 9 · Balanced!').waitFor();
                await withinViewport(frame.locator('html'));
                await page.screenshot({path: name + '-grid.png'});
                await frame.getByRole('button', {name: /Reset/}).click();
                await frame.getByText('Supply 0 · Demand 8 · 8 units short.').waitFor();
                if(name==='phone') await page.setViewportSize({width:360,height:640});
                for(const game of ['signal','home/concept/1/1','home/concept/1/2','home/concept/1/4','home/concept/1/6']){
                  await page.evaluate(hash=>location.hash=hash,'#demo/'+game);
                  await frame.getByRole('link',{name:'Arcade',exact:true}).waitFor();
                  const gameFits=await frame.locator('html').evaluate(e=>e.scrollHeight <= e.clientHeight + 2 && e.scrollWidth <= e.clientWidth + 2);
                  assert.equal(gameFits,true, name+' game fits: '+game);
                  const exitVisible=await frame.getByRole('link',{name:'Arcade',exact:true}).evaluate(e=>e.getBoundingClientRect().bottom<=innerHeight);
                  assert.equal(exitVisible,true);
                }
                await page.evaluate(()=>location.hash='#demo/signal');
                await frame.getByRole('button',{name:/Start round/}).click();
                await frame.getByRole('button',{name:/Pause/}).click();
                await frame.getByText(/Paused · Score/).waitFor();
                await frame.getByRole('button',{name:/Resume/}).click();
                await frame.getByRole('button',{name:/Pause/}).waitFor();
                await page.screenshot({path:name+'-one-screen-game.png'});
                assert.deepEqual(errors, []);
                await context.close();
                console.log(name + ': layout and interactions passed');
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-0-browser-screens
          path: '*-*.png'
          if-no-files-found: ignore
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: adiguniot-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage verified site files
        run: |
          mkdir -p _site/docs/preview
          cp index.html CNAME _site/
          cp docs/preview/AdigunIoT-portfolio-preview.html _site/docs/preview/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: publish
