          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-0-browser-screens
          path: '*-*.png'
          if-no-files-found: ignore
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: adiguniot-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage verified site files
        run: |
          mkdir -p _site/docs/preview
          cp index.html CNAME _site/
          cp -r sites _site/
          cp docs/preview/AdigunIoT-portfolio-preview.html _site/docs/preview/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..15}; do
            if count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$PAGES_ARTIFACT" --jq '.total_count') && [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 4
          done
          echo "Pages artifact did not become visible: $PAGES_ARTIFACT" >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: publish
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
